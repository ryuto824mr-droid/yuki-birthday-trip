<title>Birthday Trip Shiori</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap');

  :root{
    --bg: #0e141b;
    --bg-2: #171f28;
    --paper: #f3ede1;
    --ink: #2a241d;
    --accent: #e2a084;
    --accent-2: #7fa9c2;
    --pink: #f6b9c8;
    --coral: #f7cdd6;
    --sky: #cfe0ea;
    --lilac: #ddc9ea;
    --mint: #e7ebd8;
    --sun: #fbe3ea;
    --petal-deep: #e88ca4;
    --dot: rgba(243,237,225,0.35);
    --dot-active: #e2a084;
  }

  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    overflow: hidden;
  }

  #frame{
    position: fixed;
    inset: 0;
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ================= Birthday reveal ================= */
  #reveal{
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #191330;
    transition: opacity .9s ease, visibility .9s ease;
    overflow: hidden;
  }
  #reveal.hide{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #reveal-bg{
    position: absolute;
    inset: -15%;
    background:
      radial-gradient(circle at 24% 24%, rgba(246,185,200,0.32) 0%, transparent 44%),
      radial-gradient(circle at 78% 20%, rgba(221,201,234,0.26) 0%, transparent 46%),
      radial-gradient(circle at 50% 86%, rgba(247,205,214,0.24) 0%, transparent 50%),
      radial-gradient(circle at 84% 78%, rgba(207,224,234,0.22) 0%, transparent 45%),
      linear-gradient(160deg, #362334 0%, #241c30 55%, #171320 100%);
    animation: bgpulse 7s ease-in-out infinite;
  }
  @keyframes bgpulse{
    0%,100%{ transform: scale(1) rotate(0deg); }
    50%{ transform: scale(1.08) rotate(2deg); }
  }

  /* Firework burst rings */
  .ring{
    position: absolute;
    top: 42%;
    left: 50%;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--sun);
    transform: translate(-50%,-50%);
    opacity: 0;
    animation: burst 2.2s ease-out infinite;
  }
  .ring.r2{ border-color: var(--pink); animation-delay: .35s; }
  .ring.r3{ border-color: var(--sky); animation-delay: .7s; }
  @keyframes burst{
    0%{ width: 10px; height: 10px; opacity: .9; }
    70%{ opacity: .25; }
    100%{ width: 440px; height: 440px; opacity: 0; }
  }

  #reveal-content{
    position: relative;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
    padding: 24px;
    width: min(92vw, 460px);
    opacity: 0;
    transform: translateY(14px) scale(.97);
    animation: contentIn 1.1s cubic-bezier(.2,.8,.2,1) .25s forwards;
  }
  @keyframes contentIn{
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .ornament{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .ornament .bar{
    width: 56px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--sun));
  }
  .ornament .bar.right{ background: linear-gradient(90deg, var(--sun), transparent); }
  .ornament svg{ width: 16px; height: 16px; color: var(--sun); }

  #reveal .eyebrow{
    font-size: 12.5px;
    letter-spacing: 0.4em;
    color: var(--sky);
    text-transform: uppercase;
  }

  #reveal .headline{
    font-family: "Shippori Mincho", "Cormorant Garamond", serif;
    font-style: normal;
    font-weight: 600;
    font-size: clamp(42px, 13vw, 68px);
    letter-spacing: 0.04em;
    line-height: 1.35;
    margin: 4px 0;
    background: linear-gradient(95deg,
      var(--pink) 0%, var(--coral) 16%, var(--sun) 32%, var(--mint) 48%, var(--sky) 64%, var(--lilac) 80%, var(--pink) 100%);
    background-size: 280% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
    filter: drop-shadow(0 2px 20px rgba(242,143,163,0.35));
  }
  @keyframes shimmer{
    0%{ background-position: 0% 50%; }
    100%{ background-position: -280% 50%; }
  }
  #reveal .headline .heart{
    display: inline-block;
    animation: heartbeat 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(242,143,163,0.6));
  }
  @keyframes heartbeat{
    0%,100%{ transform: scale(1); }
    15%{ transform: scale(1.2); }
    30%{ transform: scale(1); }
    45%{ transform: scale(1.14); }
    60%{ transform: scale(1); }
  }

  #reveal .sub{
    font-size: 16px;
    letter-spacing: 0.08em;
    color: rgba(243,237,225,0.9);
    max-width: 320px;
    line-height: 1.9;
  }

  #reveal .tap{
    margin-top: 24px;
    font-size: 13px;
    letter-spacing: 0.22em;
    color: #221a3d;
    background: linear-gradient(100deg, var(--pink), var(--coral), var(--sun), var(--mint), var(--sky), var(--pink));
    background-size: 280% 100%;
    border-radius: 999px;
    padding: 16px 36px;
    font-weight: 700;
    box-shadow: 0 8px 26px rgba(242,143,163,0.35), 0 0 0 1px rgba(255,255,255,0.35) inset;
    animation: pulse 2.4s ease-in-out infinite, shimmer 5s linear infinite;
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.045); }
  }

  #sparkles{
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  .spark{
    position: absolute;
    opacity: 0;
    animation: twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100%{ opacity: 0; transform: scale(.4) rotate(0deg); }
    50%{ opacity: 1; transform: scale(1) rotate(90deg); }
  }

  #confetti{
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 2;
  }
  .petal{
    position: absolute;
    top: -10%;
    opacity: 0.95;
    background: radial-gradient(circle at 30% 28%, rgba(255,255,255,0.9), var(--petal-deep) 75%);
    border-radius: 0% 60% 60% 60%;
    animation-name: fall, sway, spin;
    animation-timing-function: linear, ease-in-out, linear;
    animation-iteration-count: infinite, infinite, infinite;
  }
  .snowflake{
    position: absolute;
    top: -6%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, rgba(255,255,255,0.85) 45%, rgba(207,224,234,0.15) 100%);
    filter: blur(.3px);
    animation-name: snowfall, snowsway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  @keyframes snowfall{
    0%{ transform: translateY(0); }
    100%{ transform: translateY(120vh); }
  }
  @keyframes snowsway{
    0%,100%{ margin-left: -18px; }
    50%{ margin-left: 18px; }
  }
  @keyframes fall{
    0%{ transform: translateY(0); }
    100%{ transform: translateY(118vh); }
  }
  @keyframes sway{
    0%,100%{ margin-left: 0px; }
    50%{ margin-left: 34px; }
  }
  @keyframes spin{
    0%{ rotate: 0deg; }
    100%{ rotate: 360deg; }
  }

  @media (prefers-reduced-motion: reduce){
    .petal, .snowflake, .spark, .ring, #reveal-bg, #reveal .headline, #reveal .tap, .mascot .sway-wrap{ animation: none !important; }
  }

  /* ---------- Dragon mascot ---------- */
  .mascot{
    position: absolute;
    bottom: -2%;
    width: min(50vw, 210px);
    z-index: 2;
    pointer-events: none;
  }
  .mascot.left{ left: -10px; }
  .mascot.right{ right: -10px; }
  .mascot .sway-wrap{
    display: block;
    animation: mascotSway 4.5s ease-in-out infinite;
    transform-origin: 50% 92%;
  }
  .mascot.right .sway-wrap{ animation-delay: .6s; }
  @keyframes mascotSway{
    0%,100%{ transform: rotate(-1.4deg); }
    50%{ transform: rotate(1.4deg); }
  }
  .mascot .snow-puff{
    position: absolute;
    border-radius: 50%;
    background: #fff;
    opacity: .9;
    animation: puffDrift 5s ease-in-out infinite;
  }
  @keyframes puffDrift{
    0%,100%{ transform: translateY(0); opacity: .85; }
    50%{ transform: translateY(-4px); opacity: 1; }
  }

  /* ================= Gallery (book page-turn) ================= */
  #gallery{
    height: 100%;
    width: 100%;
    position: relative;
    perspective: 2400px;
    background:
      radial-gradient(ellipse at 50% 20%, var(--bg-2) 0%, var(--bg) 70%);
  }

  .page{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(14px, 4vw, 32px);
    transform-origin: left center;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: transform 0.85s cubic-bezier(.45,.05,.15,1), box-shadow 0.85s ease;
    will-change: transform;
    background:
      radial-gradient(ellipse at 50% 20%, var(--bg-2) 0%, var(--bg) 70%);
  }

  .page.flipped{
    transform: rotateY(-178deg);
  }

  /* stacked-book edge shadow so unopened pages read as a pile */
  .page::before{
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset -14px 0 26px -18px rgba(0,0,0,0.65);
    opacity: var(--stack-shadow, 0);
    transition: opacity 0.5s ease;
  }

  /* darkening sweep while a page is mid-turn, for a page-curl feel */
  .page::after{
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,0.35), rgba(0,0,0,0) 45%);
    opacity: 0;
    transition: opacity 0.85s ease;
  }
  .page.flipped::after{ opacity: 1; }

  .page img{
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    border-radius: 6px;
    box-shadow:
      0 2px 6px rgba(0,0,0,0.35),
      0 18px 48px rgba(0,0,0,0.55);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  #page-tap-left, #page-tap-right{
    position: absolute;
    top: 0;
    bottom: 0;
    width: 34%;
    z-index: 6;
  }
  #page-tap-left{ left: 0; }
  #page-tap-right{ right: 0; }

  @media (prefers-reduced-motion: reduce){
    .page{ transition: none; }
  }

  #chrome-top{
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    pointer-events: none;
    z-index: 5;
  }
  #chrome-top .title{
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: 0.02em;
    color: var(--paper);
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
  }
  #chrome-top .date{
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent-2);
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }

  #dots{
    position: fixed;
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 5;
  }
  #dots button{
    appearance: none;
    border: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--dot);
    padding: 0;
    transition: background .3s ease, transform .3s ease;
  }
  #dots button.active{
    background: var(--dot-active);
    transform: scale(1.6);
  }

  #hint{
    position: fixed;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 5;
    color: var(--paper);
    font-size: 12px;
    letter-spacing: 0.08em;
    opacity: 0.85;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  #hint svg{ width: 18px; height: 18px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{ transform: translateY(0); opacity: .5; }
    50%{ transform: translateY(-6px); opacity: 1; }
  }
  #hint.hidden{ opacity: 0; }

  @media (prefers-reduced-motion: reduce){
    #hint svg{ animation: none; }
  }
</style>

<script>
(function(){
  try{
    var reveal = document.getElementById('reveal');
    var confetti = document.getElementById('confetti');
    var sparkles = document.getElementById('sparkles');
    var petalColors = ['#f6b9c8', '#f7cdd6', '#fbe3ea', '#ddc9ea', '#ffffff'];

    for(var i=0;i<26;i++){
      var p = document.createElement('div');
      p.className = 'petal';
      var sz = 14 + Math.random()*14;
      var col = petalColors[i % petalColors.length];
      p.style.left = (Math.random()*100) + '%';
      p.style.background = 'radial-gradient(circle at 30% 28%, rgba(255,255,255,0.98), ' + col + ' 80%)';
      p.style.width = sz + 'px';
      p.style.height = (sz*0.82) + 'px';
      p.style.boxShadow = '0 0 10px rgba(255,235,240,0.55)';
      p.style.animationDuration = (6 + Math.random()*4) + 's, ' + (2 + Math.random()*2) + 's, ' + (4 + Math.random()*4) + 's';
      p.style.animationDelay = (Math.random()*3) + 's, ' + (Math.random()*2) + 's, ' + (Math.random()*3) + 's';
      p.style.opacity = 0.8 + Math.random()*0.2;
      confetti.appendChild(p);
    }

    for(var n=0;n<36;n++){
      var f = document.createElement('div');
      f.className = 'snowflake';
      var fsz = 2.5 + Math.random()*4.5;
      f.style.left = (Math.random()*100) + '%';
      f.style.width = fsz + 'px';
      f.style.height = fsz + 'px';
      f.style.opacity = 0.4 + Math.random()*0.45;
      f.style.boxShadow = '0 0 ' + (fsz*1.4) + 'px rgba(255,255,255,0.5)';
      f.style.animationDuration = (8 + Math.random()*8) + 's, ' + (3 + Math.random()*3) + 's';
      f.style.animationDelay = (Math.random()*8) + 's, ' + (Math.random()*3) + 's';
      confetti.appendChild(f);
    }

    var starSvg = '<svg viewBox="0 0 24 24" fill="currentColor" width="100%" height="100%"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4L12 2z"/></svg>';
    for(var j=0;j<14;j++){
      var s = document.createElement('div');
      s.className = 'spark';
      var ssz = 5 + Math.random()*8;
      s.style.width = ssz + 'px';
      s.style.height = ssz + 'px';
      s.style.left = (8 + Math.random()*84) + '%';
      s.style.top = (8 + Math.random()*74) + '%';
      s.style.color = petalColors[j % petalColors.length];
      s.style.animationDelay = (Math.random()*2.6) + 's';
      s.style.animationDuration = (2.4 + Math.random()*1.8) + 's';
      s.innerHTML = starSvg;
      sparkles.appendChild(s);
    }

    function openReveal(){
      reveal.classList.add('hide');
    }
    reveal.addEventListener('click', openReveal);
    reveal.addEventListener('touchend', function(e){ e.preventDefault(); openReveal(); }, { passive:false });
  }catch(e){}
})();

(function(){
  try{
    var gallery = document.getElementById('gallery');
    var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));
    var dots = Array.prototype.slice.call(document.querySelectorAll('#dots button'));
    var hint = document.getElementById('hint');
    var tapLeft = document.getElementById('page-tap-left');
    var tapRight = document.getElementById('page-tap-right');
    var current = 0;
    var total = pages.length;
    var animating = false;
    var hasTurned = false;

    // stack pages so page 0 sits on top of the pile, last page on bottom
    pages.forEach(function(p, i){
      p.style.zIndex = String(total - i);
      // give un-opened pages a subtle "pile of paper" edge, fading out near the last page
      p.style.setProperty('--stack-shadow', i < total - 1 ? Math.min(0.55, 0.18 + i*0.05) : 0);
    });

    function render(){
      pages.forEach(function(p, i){
        p.classList.toggle('flipped', i < current);
      });
      dots.forEach(function(d, i){ d.classList.toggle('active', i === current); });
    }
    render();

    function goTo(target){
      target = Math.max(0, Math.min(total - 1, target));
      if(target === current || animating) return;
      animating = true;
      current = target;
      render();
      if(!hasTurned){
        hasTurned = true;
        hint.classList.add('hidden');
      }
      setTimeout(function(){ animating = false; }, 900);
    }

    dots.forEach(function(btn){
      btn.addEventListener('click', function(){
        goTo(parseInt(btn.getAttribute('data-i'), 10));
      });
    });

    tapRight.addEventListener('click', function(){ goTo(current + 1); });
    tapLeft.addEventListener('click', function(){ goTo(current - 1); });

    // swipe support
    var touchStartX = null, touchStartY = null;
    gallery.addEventListener('touchstart', function(e){
      var t = e.changedTouches[0];
      touchStartX = t.clientX; touchStartY = t.clientY;
    }, { passive: true });
    gallery.addEventListener('touchend', function(e){
      if(touchStartX === null) return;
      var t = e.changedTouches[0];
      var dx = t.clientX - touchStartX;
      var dy = t.clientY - touchStartY;
      if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)*1.3){
        if(dx < 0){ goTo(current + 1); } else { goTo(current - 1); }
      }
      touchStartX = null; touchStartY = null;
    }, { passive: true });

    setTimeout(function(){
      if(!hasTurned){ hint.classList.add('hidden'); }
    }, 4500);
  }catch(e){}
})();
</script>
